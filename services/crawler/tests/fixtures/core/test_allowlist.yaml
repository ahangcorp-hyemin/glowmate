# 테스트 전용 allowlist 픽스처.
#
# 실 정본(services/crawler/config/sources.allowlist.yaml)을 테스트가 대신 쓰지 않는 이유:
# 정본은 실제 도메인을 담고 있고, 워커 단위테스트가 그 host 를 대상으로 잡을 이유가 없다.
# 정본과 D3 원천의 대조는 `crawler.ci.allowlist_guard` 가 따로 한다.
#
# 이 픽스처의 `fixture_source` 는 실재하지 않는 도메인(`fixture.example`)을 쓴다.
# `denied_source` 는 approved=false 항목이 레지스트리·스케줄러·게이트에서 어떻게 처리되는지를
# 검사하기 위한 대상이다 — 대상이 없으면 그 검사는 영원히 녹색이다.

schema_version: 1

d3_provenance:
  verdicts.csv: "497eed691ced2a9bb4eeac1afae03691d60706bd78db4c8f738ffc616dd4eb36"
  crawl_policy.yaml: "a899ebb063d99c5d117960dea89485fc5944a0ede3f06bae5dcec4ce0f03bb47"
  transcribed_at: "2026-08-03"
  note: "테스트 픽스처 — 정본이 아니다"

sources:
  fixture_source:
    verdict: conditional
    approved: true
    max_requests_per_min: 60
    max_concurrency: 2
    retry_backoff_sec: 30
    raw_retention_days: 90
    expiry_action: tombstone_payload
    user_agent: "glowmate-crawler/0.1 (+https://github.com/ahangcorp-hyemin/glowmate; contact minseo.im@wrtn.io)"
    max_rps: 1.0
    per_host_concurrency: 2
    min_body_bytes: 512
    hosts:
      - fixture.example
      - alt.fixture.example
    allowed_path_globs:
      - "https://fixture.example/venue/*"
      - "https://fixture.example/robots.txt"
      - "https://alt.fixture.example/venue/*"
      - "https://alt.fixture.example/robots.txt"

  slow_source:
    verdict: conditional
    approved: true
    max_requests_per_min: 6
    max_concurrency: 1
    retry_backoff_sec: 30
    raw_retention_days: 90
    expiry_action: tombstone_payload
    user_agent: "glowmate-crawler/0.1 (+https://github.com/ahangcorp-hyemin/glowmate; contact minseo.im@wrtn.io)"
    max_rps: 0.1
    per_host_concurrency: 1
    min_body_bytes: 512
    hosts:
      - slow.fixture.example
    allowed_path_globs:
      - "https://slow.fixture.example/venue/*"
      - "https://slow.fixture.example/robots.txt"

  denied_source:
    verdict: forbidden
    approved: false
    reason: "테스트용 금지 소스 — hosts·globs 가 비어 있어야 한다"
    hosts: []
    allowed_path_globs: []
