# smoke_seeds.yaml — 실수집 스모크 시드 (C1 REQ-8)
#
# 여기 있는 URL 은 전부 **강남 3구(강남·서초·송파) 실재 업체의 공식 홈페이지**이며,
# D3 `crawl_policy.yaml` 의 `allowed_path_globs` 를 만족한다. 글롭 밖 URL 을 넣으면
# 사전 판정 게이트가 `source_not_allowed` 로 끊고 스모크는 수집 하한(10건)에 미달해 exit 1 한다.
#
# 왜 이 소스뿐인가: G3 판정(`docs/gates/G3.md`)의 `adapter_targets` 가 `official_website`
# 1개다. naver_place · kakao_map · google_maps · instagram · taling 은 forbidden 이고
# daangn · visitkorea 는 pending 이다. 시드를 늘리려고 그쪽 URL 을 넣지 마라 —
# allowlist 에 hosts 가 비어 있어 통과하지 못하며, 통과시키려는 변경은 FORBID-1 이 막는다.
#
# 지점 식별(idx)의 출처: https://www.spoany.co.kr/branch.php 의 `data-branchidx` 속성.
# 이 목록 페이지도 D3 글롭에 포함돼 있다.
# 주소·구는 그 페이지의 표기를 그대로 옮긴 것이며, 스모크는 주소를 파싱하지 않는다
# (필드 추출은 C2·C3 소관). `district` 는 시드가 정말 강남 3구인지 사람이 대조하기 위한 주석이다.

source: official_website

