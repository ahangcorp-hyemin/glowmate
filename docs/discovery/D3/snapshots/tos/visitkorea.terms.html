<script>
	let config = (() => {
		if (appYn === 'Y') {
            let baseConfig = {
              debug: true,
              delegateCollector: {
                collect: payload => {
                  callAppNativeFunction({ data: payload }, 'sendFeedbackEvent')
                },
                collectUser: payload => {
                  callAppNativeFunction(payload, 'sendFeedbackUserInfo')
                }
              }
            }
            if (typeof getAppVersion !== 'undefined') {
              const appVersionNumber = Number.parseInt(getAppVersion().replaceAll('.', ''))
              const isAndroid = getDevice() === 'Android'
              const requirementVersion = isAndroid ? 539 : 538
              if (appVersionNumber >= requirementVersion) {
                return {
                  ...baseConfig,
                  delegateCampaignHandler: client => {
                    callAppNativeFunction({ data: client }, 'handleCampaignDelegator')
                  },
                }
              }
            }
			return baseConfig
		} else {
			return { debug: true }
		}
	})()
	feedback.init('c38c93d3-ae26-11ef-ad40-0242ac130002', config, {
		
		platform: "WEB",
		registerType: 'General',
		
		
		
		isDigitalResident: false,
		
		isTrssUser: false,
		
		
		
	})
</script>
