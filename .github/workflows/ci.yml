name: ci

# F1-REPO-SCAFFOLD REQ-5·REQ-6.
#
# 검사 job 8개는 `needs` 를 선언하지 않는다 — 병렬 실행이며, 하나가 죽어도 나머지 7개의
# 판정이 남아야 픽스처 귀속 검증(REQ-5 (3))이 성립한다.
# 애그리게이터 `ci-required` 1개만 needs 를 갖고, 브랜치 보호의 유일한 필수 체크로 등록된다.
#
# 셋업 스텝을 composite action 으로 빼지 않고 각 job 에 인라인한 이유:
# `.github/actions/**` 는 F1 touches 밖이라 path-guard(FORBID-4)가 red 가 된다.

on:
  pull_request:
  push:
    branches:
      - main
      # REQ-5 (2) 는 픽스처 트리를 **실제 Actions 런**으로 검증할 것을 요구한다.
      # PR 을 8개 만들지 않고 런을 발생시키기 위한 트리거다.
      # 픽스처 브랜치는 tools/ci-meta/fixtures-run.mjs 가 PR HEAD 에서 생성하므로
      # 워크플로 파일 sha 가 일치한다(신선도 검사 통과 조건).
      - 'ci-fixture/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read
  # 주의: `administration` 은 GITHUB_TOKEN 의 유효한 permission 스코프가 아니다.
  # 넣으면 워크플로 파일 자체가 무효가 되어 job 이 0개 실행된다(실측으로 확인했다).
  #
  # REQ-6 (a)·REQ-7 (b) 의 보호 설정 조회는 legacy branch protection 엔드포인트
  # (`/branches/{b}/protection`, admin 필요) 대신 **ruleset 엔드포인트**
  # (`/repos/{o}/{r}/rules/branches/{b}`)를 쓴다 — 읽기 권한만으로 조회된다.

env:
  # 검사기들이 승인 리뷰·브랜치 보호를 조회한다. 조회 불가 시 검사기는 exit 1 한다(판정 불가 ≠ 통과).
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "규칙 REQ-2 — strict/noUncheckedIndexedAccess/noImplicitOverride 상속 + tsc 오류 0건"
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "규칙 REQ-5 REQ-6 REQ-7 FORBID-2 FORBID-5 — lint + CI 메타 검사"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:ci-meta

  boundary:
    name: boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "규칙 REQ-3 FORBID-1 — 의존 도달성 + 의존 분류 이중 경계"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:dep-graph

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: echo "규칙 REQ-1 REQ-8 FORBID-3 — 워크스페이스 구성 + 정적 렌더링 기본값"
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # REQ-4 — 이 job 은 setup-python 을 하지 않는다.
      # services/crawler 가 워크스페이스 밖이라는 것을 build 성공으로 실증한다.
      - name: 'REQ-4 — python 툴체인 없이 pnpm -r build'
        run: pnpm -r build
      - run: pnpm test:workspace
      - run: pnpm test
      - name: 'REQ-8 / FORBID-3 — next build 라우트 요약'
        run: |
          set -euo pipefail
          pnpm --filter @glowmate/web exec next build | tee /tmp/next-build.log
      - name: 'REQ-8 / FORBID-3 — 요약 파싱 + 페이지 라우트 토큰 grep'
        # 빌드가 성공하는 것과 렌더링 기본값이 정적인 것은 다르다.
        # 이 스텝이 없으면 force-dynamic 을 넣어도 test job 이 green 이다.
        run: pnpm test:routes /tmp/next-build.log

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: echo "규칙 REQ-4 — crawler 독립 툴체인 + Playwright 스모크"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: 의존 설치
        working-directory: services/crawler
        run: pip install --disable-pip-version-check -e '.[dev]'
      - name: ruff
        working-directory: services/crawler
        run: ruff check .
      - name: Playwright 브라우저
        working-directory: services/crawler
        run: python -m playwright install --with-deps chromium
      - name: pytest
        working-directory: services/crawler
        run: python -m pytest -q

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: echo "규칙 SECRET-SCAN — 자격증명 커밋 차단"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks 설치
        run: |
          set -euo pipefail
          version=8.28.0
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: 스캔 설정 생성
        # 커밋된 설정 파일을 두지 않는다 — 루트 .gitleaks.toml 은 F1 touches 밖이다(FORBID-4).
        # 런타임 생성이므로 diff 에 나타나지 않는다.
        run: |
          cat > /tmp/gitleaks.toml <<'TOML'
          [extend]
          useDefault = true

          [allowlist]
          description = "자리표시자 예시 파일 · 위반 재현용 픽스처 원본 · 빌드 산출물"
          paths = [
            '''\.env\.example$''',
            # 픽스처 원본은 의도적으로 가짜 자격증명을 담고 있다(REQ-5 픽스처 ⑤).
            # 본 트리에서 이걸 잡으면 전 브랜치의 secret-scan 이 red 가 되어
            # "대응 job 만 red" 가 깨진다 — eslint ignores·FORBID-2 제외와 같은 근거다.
            # 픽스처 브랜치에서는 오버레이가 이 파일을 apps/web/src/lib/ 로 복사하므로
            # 제외 경로 밖이 되어 정상적으로 red 가 된다.
            '''^\.github/ci-fixtures/''',
            '''(^|/)\.next/''',
            '''(^|/)node_modules/''',
            '''(^|/)(dist|out)/''',
          ]
          TOML
      # 스캔을 두 번 돌린다. 어느 한쪽도 생략하지 않는다.
      #
      # (1) 이력 — 범위를 `origin/main..HEAD` 로 한정한다. 범위를 주지 않으면 gitleaks 가
      #     리포에 도달 가능한 **전 브랜치의 커밋**을 스캔한다. `ci-fixture/secret-scan` 의
      #     오버레이 커밋에는 가짜 자격증명이 apps/web/src/lib/ 에 있으므로,
      #     범위 없이 돌리면 무관한 브랜치의 픽스처 때문에 본 PR 이 red 가 된다(실측).
      #     PR 안에서 넣었다 지운 비밀값은 이 스캔이 잡는다.
      # (2) 워킹트리 — 지금 트리에 실제로 존재하는 값을 잡는다. 이력 범위가 비는
      #     상황(예: main 직접 push)에서 검사가 공허해지지 않게 한다.
      - name: '스캔 (1) 이 브랜치가 더한 커밋'
        run: gitleaks detect --no-banner --redact --config /tmp/gitleaks.toml --source . --log-opts="origin/main..HEAD"
      - name: '스캔 (2) 워킹트리'
        run: gitleaks detect --no-git --no-banner --redact --config /tmp/gitleaks.toml --source .

  discovery:
    name: discovery
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: echo "규칙 FORBID-6 — validate_d*.py 존재 요구 + 비스텁 요구"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:discovery

  path-guard:
    name: path-guard
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: echo "규칙 FORBID-4 — .github/pr-task 계약의 touches 밖 경로 변경 차단"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:path-guard

  # F2a-CORE-SCHEMA — core 스키마 마이그레이션 · 제약 · PostGIS · append-only · 왕복 동일성.
  #
  # 실제 PostGIS 컨테이너에서만 판정한다(mock 금지, REQ-2 acceptance).
  # DB 없이 초록인 스키마 검사는 아무것도 검사하지 않는 검사이고, 그 위에 C1·C4·C5·C6·C7 의
  # detect 가 얹힌다.
  db-schema:
    name: db-schema
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glowmate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/glowmate_test
      # FORBID-1 (a) — 머지된 up 파일 동결의 기준. 해석 실패 시 검사기가 exit 1 한다.
      DB_MIGRATION_BASE_REF: origin/main
    steps:
      - run: echo "규칙 F2a REQ-1..REQ-7 FORBID-1..FORBID-5 — core 스키마 · 제약 · PostGIS · append-only · 왕복"
      - uses: actions/checkout@v4
        with:
          # FORBID-1 (a) 는 base(origin/main) 원본과 대조한다. 얕은 체크아웃이면 판정 불가다.
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 'REQ-7 / FORBID-1 — 마이그레이션 무결성 (머지분 동결 + 신규 up 의 손실형 DDL)'
        working-directory: packages/db
        run: pnpm db:check-migrations
      - name: 'REQ-1 — 마이그레이션 적용'
        working-directory: packages/db
        run: pnpm db:migrate
      - name: 'REQ-1 · REQ-4 · REQ-6 / FORBID-2 · FORBID-3 · FORBID-4'
        working-directory: packages/db
        run: pnpm test:schema-core
      - name: 'REQ-3 — 제약 3종 + C4 불변식 정합 픽스처'
        working-directory: packages/db
        run: pnpm test:constraints-core
      - name: 'REQ-2 — PostGIS 반경 검색 인덱스 (시드 50,000행)'
        working-directory: packages/db
        run: pnpm test:geo
      - name: 'REQ-5 / FORBID-5 — source_record append-only + tombstone'
        working-directory: packages/db
        run: pnpm test:append-only
      - name: '위반 픽스처 — 각 검사가 실제로 red 가 되는지 (no-op down 포함)'
        working-directory: packages/db
        run: pnpm test:violations-core
      - name: 'REQ-7 — up → down → up 왕복 덤프 sha256 동일성'
        working-directory: packages/db
        run: pnpm db:roundtrip
      - name: 'types.ts 가 마이그레이션 재생성물과 동일'
        working-directory: packages/db
        run: pnpm db:generate-types --check

  # ─────────────────────────────────────────────────────────────────────
  # REQ-6 — 브랜치 보호의 유일한 필수 체크.
  #
  # `if: always()` 는 FORBID-2 패턴 사전의 대상이 아니다. 계약 FORBID-2 when 의 제외 절이
  # "애그리게이터 ci-required job 의 if: 조건"을 job 이름 `ci-required` 하나에 한정해 제외한다.
  # 제외가 필요한 이유: needs 만 선언하면 선행 job 실패 시 이 job 이 아예 실행되지 않고
  # `skipped` 로 끝나며, GitHub 브랜치 보호는 skipped 필수 체크를 **통과로 취급한다**.
  # 즉 8개 job 이 전부 red 여도 머지가 열린다 — B-8 이 막으려던 상태 그 자체다.
  # 따라서 실행을 보장한 뒤 needs.*.result 를 명시 평가해 non-success 를 실패로 전파한다.
  # ─────────────────────────────────────────────────────────────────────
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: always()
    needs:
      - typecheck
      - lint
      - boundary
      - test
      - python
      - secret-scan
      - discovery
      - path-guard
      # F2a-CORE-SCHEMA 가 추가한 검사 job. REQ-6 (b) 는 `ci-required.needs` 가
      # ci.yml 의 전 검사 job 을 포함할 것을 요구한다 — 빠지면 이 job 이 red 여도 머지가 열린다.
      - db-schema
    steps:
      - name: 'REQ-6 — 선행 job 결과 집계 (실패 전파)'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          node - <<'JS'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const entries = Object.entries(needs);
          if (entries.length === 0) {
            console.error('REQ-6: needs 가 비어 있다 — 애그리게이터가 아무것도 집계하지 않는다');
            process.exit(1);
          }
          for (const [name, v] of entries) {
            console.log(`  ${v.result === 'success' ? '✓' : '✗'} ${name}: ${v.result}`);
          }
          const bad = entries.filter(([, v]) => v.result !== 'success');
          if (bad.length > 0) {
            console.error(`REQ-6: ci-required 실패 — success 가 아닌 선행 job ${bad.length}건`);
            process.exit(1);
          }
          console.log(`REQ-6: 선행 job ${entries.length}건 전부 success`);
          JS
